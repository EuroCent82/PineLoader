name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Test
        run: dotnet test PineLoader.Tests/PineLoader.Tests.csproj -c Debug
      - name: Set up JDK 17
        if: ${{ success() && hashFiles('src/Warehouse/Warehouse.csproj') != '' }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Build Warehouse
        if: ${{ success() && hashFiles('src/Warehouse/Warehouse.csproj') != '' }}
        run: dotnet build src/Warehouse/Warehouse.csproj -c Debug
